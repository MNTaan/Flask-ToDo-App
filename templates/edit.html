{% extends 'base.html' %}

{% block title %}Chỉnh sửa công việc - TaskFlow{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
                <h5 class="card-title fw-bold text-dark d-flex align-items-center gap-2 mb-0">
                    <i class="bi bi-pencil-square text-primary"></i>
                    Chỉnh sửa công việc
                </h5>
                <a href="{{ url_for('index') }}" class="btn btn-sm btn-outline-secondary rounded-pill">
                    <i class="bi bi-arrow-left"></i> Quay lại
                </a>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('edit', todo_id=todo['id']) }}" method="POST">
                    <!-- Title -->
                    <div class="mb-3">
                        <label for="title" class="form-label small fw-semibold text-secondary">Tiêu đề công việc <span class="text-danger">*</span></label>
                        <input type="text" class="form-control form-control-lg fs-6" id="title" name="title" value="{{ todo['title'] }}" required autofocus>
                    </div>

                    <!-- Description -->
                    <div class="mb-3">
                        <label for="description" class="form-label small fw-semibold text-secondary">Mô tả chi tiết</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ todo['description'] or '' }}</textarea>
                    </div>

                    <!-- Category & Priority Row -->
                    <div class="row g-3 mb-3">
                        <div class="col-sm-6">
                            <label for="category" class="form-label small fw-semibold text-secondary">Danh mục</label>
                            <input class="form-control" list="categoryOptions" id="category" name="category" value="{{ todo['category'] or 'Chung' }}">
                            <datalist id="categoryOptions">
                                <option value="Học tập">
                                <option value="Công việc">
                                <option value="Cá nhân">
                                <option value="Dự án">
                                <option value="Sức khỏe">
                            </datalist>
                        </div>
                        <div class="col-sm-6">
                            <label for="priority" class="form-label small fw-semibold text-secondary">Mức ưu tiên</label>
                            <select class="form-select" id="priority" name="priority">
                                <option value="low" {% if todo['priority'] == 'low' %}selected{% endif %}>🟢 Thấp</option>
                                <option value="medium" {% if todo['priority'] == 'medium' %}selected{% endif %}>🟡 Trung bình</option>
                                <option value="high" {% if todo['priority'] == 'high' %}selected{% endif %}>🔴 Cao</option>
                            </select>
                        </div>
                    </div>

                    <!-- Due Date -->
                    <div class="mb-4">
                        <label for="due_date" class="form-label small fw-semibold text-secondary">Hạn chót (Deadline)</label>
                        <input type="date" class="form-control" id="due_date" name="due_date" value="{{ todo['due_date'] or '' }}">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary flex-grow-1 fw-semibold py-2">
                            <i class="bi bi-check2-circle me-1"></i> Lưu thay đổi
                        </button>
                        <a href="{{ url_for('index') }}" class="btn btn-light border py-2 px-3">Hủy</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
